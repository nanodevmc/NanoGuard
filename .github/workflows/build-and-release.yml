name: Build and Release NanoGuard

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cpp-engine:
    name: Build C++17 Core Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: nanoguard-cli-windows-x64.exe
            src_path: build/bin/Release/nanoguard.exe
          - os: ubuntu-latest
            artifact_name: nanoguard-cli-linux-x64
            src_path: build/bin/nanoguard
          - os: macos-latest
            artifact_name: nanoguard-cli-macos-x64
            src_path: build/bin/nanoguard
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B build -S resources/engine_cpp -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Engine
        run: |
          cmake --build build --config Release --parallel 2

      - name: Rename executable
        shell: bash
        run: |
          mkdir -p bin-out
          cp "${{ matrix.src_path }}" "bin-out/${{ matrix.artifact_name }}"

      - name: Upload C++ Engine Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpp-engine-${{ matrix.os }}
          path: bin-out/${{ matrix.artifact_name }}

  build-rust-fastscan:
    name: Build Rust FastScan Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: nanoguard-fastscan-windows-x64.exe
            src_path: crates/nanoguard-fastscan/target/release/nanoguard-fastscan.exe
          - os: ubuntu-latest
            artifact_name: nanoguard-fastscan-linux-x64
            src_path: crates/nanoguard-fastscan/target/release/nanoguard-fastscan
          - os: macos-latest
            artifact_name: nanoguard-fastscan-macos-x64
            src_path: crates/nanoguard-fastscan/target/release/nanoguard-fastscan
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Binary
        run: |
          cd crates/nanoguard-fastscan
          cargo build --release

      - name: Rename executable
        shell: bash
        run: |
          mkdir -p bin-out
          cp "${{ matrix.src_path }}" "bin-out/${{ matrix.artifact_name }}"

      - name: Upload Rust FastScan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-fastscan-${{ matrix.os }}
          path: bin-out/${{ matrix.artifact_name }}

  build-tauri-windows:
    name: Build Tauri v2 Windows Release
    needs: [build-cpp-engine, build-rust-fastscan]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download Windows C++ Engine
        uses: actions/download-artifact@v4
        with:
          name: cpp-engine-windows-latest
          path: resources/engine

      - name: Download Windows Rust FastScan
        uses: actions/download-artifact@v4
        with:
          name: rust-fastscan-windows-latest
          path: resources/engine

      - name: Prepare Windows Engine Names
        shell: bash
        run: |
          cp resources/engine/nanoguard-cli-windows-x64.exe resources/engine/nanoguard.exe || true
          cp resources/engine/nanoguard-fastscan-windows-x64.exe resources/engine/nanoguard-fastscan.exe || true

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Tauri Binary
        run: npx @tauri-apps/cli build --no-bundle

      - name: Rename Tauri Output
        shell: bash
        run: |
          mkdir -p tauri-out
          cp src-tauri/target/release/nanoguard.exe tauri-out/NanoGuard-Tauri-v0.1.2-Windows.exe

      - name: Upload Tauri Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-release
          path: tauri-out/NanoGuard-Tauri-v0.1.2-Windows.exe

  build-and-verify-macos:
    name: Build, Playwright E2E & Package GUI (macOS)
    needs: [build-cpp-engine, build-rust-fastscan]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download C++ Engine (macOS)
        uses: actions/download-artifact@v4
        with:
          name: cpp-engine-macos-latest
          path: resources/engine_cpp/bin

      - name: Download Rust FastScan (macOS)
        uses: actions/download-artifact@v4
        with:
          name: rust-fastscan-macos-latest
          path: crates/target/release

      - name: Prepare Engine for Bundling
        run: |
          mkdir -p resources/engine
          cp resources/engine_cpp/bin/nanoguard-cli-macos-x64 resources/engine/nanoguard || true
          cp crates/target/release/nanoguard-fastscan-macos-x64 resources/engine/nanoguard-fastscan || true
          chmod +x resources/engine/* || true

      - name: Install Dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Build Web Renderer & Electron Main
        run: |
          npm run build:renderer
          npm run build:electron

      - name: Run Playwright E2E Verification & Capture Screenshots
        run: |
          node scripts/verify_gui.js

      - name: Commit & Push Verified Retina Screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          git commit -m "docs(screenshots): update verified E2E Retina screenshots [skip ci]" || true
          git push origin main || true

      - name: Package macOS App (DMG & ZIP)
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Filter Clean macOS Packages
        run: |
          mkdir -p dist-mac-clean
          cp dist-release/*.dmg dist-mac-clean/ 2>/dev/null || true
          cp dist-release/*.zip dist-mac-clean/ 2>/dev/null || true

      - name: Upload Clean macOS Packages
        uses: actions/upload-artifact@v4
        with:
          name: gui-macos-clean
          path: dist-mac-clean/

  build-gui-windows:
    name: Build & Package GUI (Windows Electron)
    needs: [build-cpp-engine, build-rust-fastscan]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download C++ Engine (Windows)
        uses: actions/download-artifact@v4
        with:
          name: cpp-engine-windows-latest
          path: resources/engine

      - name: Download Rust FastScan (Windows)
        uses: actions/download-artifact@v4
        with:
          name: rust-fastscan-windows-latest
          path: resources/engine

      - name: Prepare Engine for Bundling
        shell: bash
        run: |
          cp resources/engine/nanoguard-cli-windows-x64.exe resources/engine/nanoguard.exe || true
          cp resources/engine/nanoguard-fastscan-windows-x64.exe resources/engine/nanoguard-fastscan.exe || true

      - name: Install Dependencies
        run: npm install

      - name: Build & Package Windows (NSIS & Portable)
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Filter Clean Windows Packages
        shell: bash
        run: |
          mkdir -p dist-win-clean
          cp dist-release/*.exe dist-win-clean/ 2>/dev/null || true

      - name: Upload Clean Windows Packages
        uses: actions/upload-artifact@v4
        with:
          name: gui-windows-clean
          path: dist-win-clean/

  build-gui-linux:
    name: Build & Package GUI (Linux AppImage)
    needs: [build-cpp-engine, build-rust-fastscan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download C++ Engine (Linux)
        uses: actions/download-artifact@v4
        with:
          name: cpp-engine-ubuntu-latest
          path: resources/engine

      - name: Download Rust FastScan (Linux)
        uses: actions/download-artifact@v4
        with:
          name: rust-fastscan-ubuntu-latest
          path: resources/engine

      - name: Prepare Engine for Bundling
        run: |
          cp resources/engine/nanoguard-cli-linux-x64 resources/engine/nanoguard || true
          cp resources/engine/nanoguard-fastscan-linux-x64 resources/engine/nanoguard-fastscan || true
          chmod +x resources/engine/* || true

      - name: Install Dependencies
        run: npm install

      - name: Build & Package Linux (AppImage)
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Filter Clean Linux Packages
        run: |
          mkdir -p dist-linux-clean
          cp dist-release/*.AppImage dist-linux-clean/ 2>/dev/null || true

      - name: Upload Clean Linux Packages
        uses: actions/upload-artifact@v4
        with:
          name: gui-linux-clean
          path: dist-linux-clean/

  release:
    name: Publish GitHub Release with Artifacts
    needs: [build-cpp-engine, build-rust-fastscan, build-tauri-windows, build-and-verify-macos, build-gui-windows, build-gui-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Organize Clean Release Files
        run: |
          mkdir -p release-ready
          # Copy strictly binaries and installers:
          cp release-assets/*.exe release-ready/ 2>/dev/null || true
          cp release-assets/*.dmg release-ready/ 2>/dev/null || true
          cp release-assets/*.zip release-ready/ 2>/dev/null || true
          cp release-assets/*.AppImage release-ready/ 2>/dev/null || true
          cp release-assets/nanoguard-cli-* release-ready/ 2>/dev/null || true
          cp release-assets/nanoguard-fastscan-* release-ready/ 2>/dev/null || true

          # Purge any debug yml, blockmaps, or loose screenshot images
          rm -f release-ready/*.yml release-ready/*.blockmap release-ready/*.png release-ready/builder-debug.yml

          # Generate SHA256 checksums
          cd release-ready
          sha256sum * > SHA256SUMS.txt
          cd ..

          echo "=== RELEASE READY ASSETS ==="
          ls -la release-ready/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2
          name: "NanoGuard v0.1.2 - Advanced Security Suite & Tauri v2 Lightweight Core"
          draft: false
          prerelease: false
          files: release-ready/*
          body: |
            # ɴᴀɴᴏɢᴜᴀʀᴅ v0.1.2
            ### Native Bytecode Armor & Backdoor Hunter

            Официальный релиз **NanoGuard** — брата-близнеца [NanoDecompiler](https://github.com/NanoDev1488/NanoDecompiler).
            Нативный движок для тотального аудита чужих JAR-плагинов и непробиваемой защиты собственных.

            ---

            ### 🚀 Главные обновления:
            - **Tauri v2 Ultra-Light Core**: Доступна облегчённая версия на Rust + WebView2 (`NanoGuard-Tauri-v0.1.2-Windows.exe` весит всего ~9.5 МБ и расходует в 5 раз меньше памяти!).
            - **Multi-Platform Native Bridges**: Вшивание в JAR одновременно машинного кода Windows (`nanoguard_bridge.dll`) и Linux ELF (`nanoguard_bridge.so`) для Pterodactyl/Ubuntu серверов.
            - **Flow-Flattening & Opaque Predicates**: Непрозрачные ловушки `(N ^ N) == 0` и мёртвые ветки `athrow null`, ломающие декомпиляторы CFR, Fernflower, Recaf.
            - **Batch Plugins Scanner**: Пакетное экспресс-сканирование всей папки `plugins/` в 1 клик.
            - **1-Click Quick Presets**: Light (Server-Friendly), Native Only, Anti-Leak Heavy Max.

            ---

            ### 📦 Загрузка релизов:
            - **⚡ Windows GUI (Tauri v2 Ultra-Light, 9.5 МБ)**: `NanoGuard-Tauri-v0.1.2-Windows.exe`
            - **Windows GUI (Electron Portable EXE)**: `NanoGuard-0.1.2-Windows-Portable.exe`
            - **Windows GUI (Electron Setup Installer)**: `NanoGuard-0.1.2-Windows-Setup.exe`
            - **Linux GUI (AppImage)**: `NanoGuard-0.1.2-Linux.AppImage`
            - **macOS GUI (DMG / ZIP)**: `NanoGuard-0.1.2-macOS.dmg`, `NanoGuard-0.1.2-macOS.zip`
            - **Нативные CLI утилиты (C++17 & Rust FastScan)**:
              - Windows: `nanoguard-cli-windows-x64.exe`, `nanoguard-fastscan-windows-x64.exe`
              - Linux: `nanoguard-cli-linux-x64`, `nanoguard-fastscan-linux-x64`
              - macOS: `nanoguard-cli-macos-x64`, `nanoguard-fastscan-macos-x64`

            ---
            *Разработано [NanoDev](https://t.me/radoqi) · Канал: [t.me/WineSquad](https://t.me/WineSquad)*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

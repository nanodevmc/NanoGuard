[package]
name = "nanoguard"
version = "0.1.2"
description = "Native Bytecode Armor & Backdoor Hunter for Java & Minecraft Plugins"
authors = ["NanoDev <t.me/WineSquad>"]
edition = "2021"

[lib]
name = "nanoguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
brotli = "7.0"
base64 = "0.22"
sysinfo = "0.33"
log = "0.4"
